<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<title>Weighted Chinup Calculator</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#f4f4f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{max-width:720px;margin:auto;padding:18px 14px 40px}
h1{font-size:30px;margin:4px 0 6px}.sub{opacity:.7;margin-bottom:20px}
.card{background:#1c1c1e;border-radius:16px;padding:16px;margin:12px 0}
h2{font-size:20px;margin:0 0 12px}
label{display:block;font-size:14px;margin:12px 0 5px;opacity:.9}
input,select{width:100%;font-size:17px;padding:12px;border:0;border-radius:10px;background:#2c2c2e;color:#fff}
.result{margin-top:12px;padding:12px;background:#2c2c2e;border-radius:10px;line-height:1.55}
.big{font-size:19px;font-weight:700}.muted{opacity:.7;font-size:13px}
.plate{font-weight:700}
button{width:100%;padding:12px;border:0;border-radius:10px;background:#444;color:#fff;font-size:16px;margin-top:10px}
hr{border:0;border-top:1px solid #3a3a3c;margin:15px 0}
</style>
</head>
<body>
<main>
<h1>Weighted Chinup Calculator</h1>

<div class="card">
<h2>Daily Inputs</h2>
<label>Bodyweight (lbs)<input id="bw" type="number" step="0.1" inputmode="decimal"></label>
<label>Bodyweight + Belt (lbs)<input id="bwbelt" type="number" step="0.1" inputmode="decimal"></label>
</div>

<div class="card">
<h2>Feeler Set → Top Set Recommendation</h2>
<label>Feeler Set Reps<input id="feelerReps" type="number" min="1" max="12" step="1" inputmode="numeric"></label>
<label>Feeler Set RIR / RPE<select id="feelerRpe"></select></label>
<label>Target Top Set Reps<input id="targetReps" type="number" min="1" max="12" step="1" inputmode="numeric"></label>
<label>Target Top Set RIR / RPE<select id="targetRpe"></select></label>
<div class="result" id="topOutput">Enter your feeler set and target.</div>
</div>

<div class="card">
<h2>Actual Top Set → Backoff Recommendation</h2>
<label>Actual Added Weight (lbs)<input id="actualLoad" type="number" min="0" step="0.001" inputmode="decimal"></label>
<label>Actual Top Set Reps<input id="actualReps" type="number" min="1" max="12" step="1" inputmode="numeric"></label>
<label>Actual Top Set RIR / RPE<select id="actualRpe"></select></label>
<div class="result" id="e1rmOutput">Enter your actual top set.</div>
<hr>
<label>Backoff Reps<input id="backoffReps" type="number" min="1" max="12" step="1" inputmode="numeric"></label>
<label>Backoff RIR / RPE Cap<select id="backoffRpe"></select></label>
<div class="result" id="backoffOutput">Enter your actual top set, backoff reps and RPE cap.</div>
</div>
</main>

<script>
const rpeLabels=[
["0 RIR / RPE 10",10],["0.5 RIR / RPE 9.5",9.5],["1 RIR / RPE 9",9],
["1.5 RIR / RPE 8.5",8.5],["2 RIR / RPE 8",8],["2.5 RIR / RPE 7.5",7.5],
["3 RIR / RPE 7",7],["3.5 RIR / RPE 6.5",6.5],["4 RIR / RPE 6",6],
["4.5 RIR / RPE 5.5",5.5],["5 RIR / RPE 5",5],["5.5 RIR / RPE 4.5",4.5],
["6 RIR / RPE 4",4],["6.5 RIR / RPE 3.5",3.5],["7 RIR / RPE 3",3],
["7.5 RIR / RPE 2.5",2.5],["8 RIR / RPE 2",2],["8.5 RIR / RPE 1.5",1.5],
["9 RIR / RPE 1",1]
];

// User-provided chart. Values are percentages, not decimals.
const chart={
1:[100,97.8,95.5,93,91,89,87,85,83,81,79,77,75,73,71,69,67,65,63],
2:[95.5,93.5,91,89,87,85,83,81,79,77,75,73,71,69,67,65,63,61,59],
3:[92.2,90,87.5,85.5,83.5,81.5,79.5,77.5,75.5,73.5,71.5,69.5,67.5,65.5,63.5,61.5,59.5,57.5,55.5],
4:[89.2,87,84.5,82.5,80.5,78.5,76.5,74.5,72.5,70.5,68.5,66.5,64.5,62.5,60.5,58.5,56.5,54.5,52.5],
5:[86.3,84,81.5,79.5,77.5,75.5,73.5,71.5,69.5,67.5,65.5,63.5,61.5,59.5,57.5,55.5,53.5,51.5,49.5],
6:[83.7,81.5,79,77,75,73,71,69,67,65,63,61,59,57,55,53,51,49,47],
7:[81.1,79.5,76.5,75,73,71,69,67,65,63,61,59,57,55,53,51,49,47,45],
8:[78.6,76.5,74,72,70,68,66,64,62,60,58,56,54,52,50,48,46,44,42],
9:[76.2,74,71.5,69.5,67.5,65.5,63.5,61.5,59.5,57.5,55.5,53.5,51.5,49.5,47.5,45.5,43.5,41.5,39.5],
10:[73.9,71.5,69,67,65,63,61,59,57,55,53,51,49,47,45,43,41,39,37],
11:[71.8,69.5,67,65,63,61,59,57,55,53,51,49,47,45,43,41,39,37,35],
12:[69.8,67.5,65,63,61,59,57,55,53,51,49,47,45,43,41,39,37,35,33]
};

const rpes=[10,9.5,9,8.5,8,7.5,7,6.5,6,5.5,5,4.5,4,3.5,3,2.5,2,1.5,1];

function fillSelect(id){
 const s=document.getElementById(id);
 rpeLabels.forEach(([label,val])=>{
  const o=document.createElement("option");o.value=val;o.textContent=label;s.appendChild(o);
 });
}
["feelerRpe","targetRpe","actualRpe","backoffRpe"].forEach(fillSelect);

// Inventory: unlimited larger plates, max 2 microplates each.
const unlimited=[44,33,22,11,5.5,2.75];
const micro=[2.2,1.1,0.55,0.275];

function plateCombo(target){
 target=Math.max(0,target);
 // Work in thousandths to avoid floating-point issues.
 const T=Math.floor(target*1000+1e-7);
 let best=-1,bestCount=Infinity,bestVec=null;

 // The unlimited portion is optimised greedily, then all microplate combinations are checked.
 // Since the large plates are multiples of 0.25/0.5/1.0-ish, exhaustive micro combinations
 // plus greedy large loading gives a practical exact result for the available inventory.
 for(let a=0;a<=2;a++)for(let b=0;b<=2;b++)for(let c=0;c<=2;c++)for(let d=0;d<=2;d++){
   const micros=[a,b,c,d];
   const microSum=Math.round((a*2.2+b*1.1+c*.55+d*.275)*1000);
   if(microSum>T) continue;
   let rem=T-microSum;
   const counts=[];
   let n=0;
   for(const p of unlimited){
     const q=Math.floor(rem/Math.round(p*1000));
     counts.push(q); n+=q; rem-=q*Math.round(p*1000);
   }
   const total=T-rem;
   const vec=[...counts,...micros];
   const count=n+a+b+c+d;
   if(total>best || (total===best && count<bestCount)){
     best=total;bestCount=count;bestVec=vec;
   }
 }
 if(best<=0)return {total:0,plates:"Bodyweight only"};
 const names=[44,33,22,11,5.5,2.75,2.2,1.1,.55,.275];
 const parts=[];
 bestVec.forEach((n,i)=>{if(n>0)parts.push(n===1?`${names[i]} lb`:`${n} × ${names[i]} lb`)});
 return {total:best/1000,plates:parts.join(" + ")};
}

function pct(reps,rpe){
 if(!chart[reps])return null;
 const i=rpes.indexOf(Number(rpe));
 return i<0?null:chart[reps][i]/100;
}

function val(id){return parseFloat(document.getElementById(id).value)}

function recalc(){
 const bw=val("bw"),bwbelt=val("bwbelt");
 const fr=parseInt(document.getElementById("feelerReps").value);
 const fp=pct(fr,val("feelerRpe"));
 const tr=parseInt(document.getElementById("targetReps").value);
 const tp=pct(tr,val("targetRpe"));

 let topText="Enter your feeler set and target.";
 if(fp && bw>0){
   const feelerE1rm=bw/fp;
   if(tp && bwbelt>0){
     topText="";
     const idealTotal=feelerE1rm*tp;
     const exactAdded=idealTotal-bwbelt;
     const load=plateCombo(exactAdded);
     topText+=`<div><b>Suggested total weight:</b> ${idealTotal.toFixed(2)} lbs</div>`;
     topText+=`<div><b>Exact added weight required:</b> (${Math.max(0,exactAdded).toFixed(2)} lbs)</div>`;
     topText+=`<div class="big">Suggested weight: ${load.total.toFixed(3)} lb</div>`;
     topText+=`<div class="plate">Plates: ${load.plates}</div>`;
   }
 }
 document.getElementById("topOutput").innerHTML=topText;

 const al=val("actualLoad"),ar=parseInt(document.getElementById("actualReps").value),ap=pct(ar,val("actualRpe"));
 let eText="Enter your actual top set.";
 if(ap && bwbelt>0 && !isNaN(al)){
   const actualTotal=bwbelt+al;
   const e1rm=actualTotal/ap;
   eText=`<div class="big">Session e1RM: ${e1rm.toFixed(2)} lbs</div>`;
   document.getElementById("e1rmOutput").innerHTML=eText;

   const br=parseInt(document.getElementById("backoffReps").value);
   const backoffPct=pct(br,val("backoffRpe"));
   if(backoffPct){
     const idealBack=e1rm*backoffPct;
     const exactBack=idealBack-bwbelt;
     const backLoad=plateCombo(exactBack);
     let bText=`<div><b>Backoff target total weight:</b> ${idealBack.toFixed(2)} lbs</div>`;
     bText+=`<div><b>Exact added weight required:</b> (${Math.max(0,exactBack).toFixed(2)} lbs)</div>`;
     bText+=`<div class="big">Suggested weight: ${backLoad.total.toFixed(3)} lbs</div>`;
     bText+=`<div class="plate">Plates: ${backLoad.plates}</div>`;
     document.getElementById("backoffOutput").innerHTML=bText;
   }else{
     document.getElementById("backoffOutput").innerHTML="Enter your actual top set, backoff reps and RPE cap.";
   }
 }else{
   document.getElementById("e1rmOutput").innerHTML=eText;
   document.getElementById("backoffOutput").innerHTML="Enter your actual top set, backoff reps and RPE cap.";
 }

 const data={};
 document.querySelectorAll("input,select").forEach(x=>data[x.id]=x.value);
 localStorage.setItem("weighted-chinup-v4",JSON.stringify(data));
}

const saved=JSON.parse(localStorage.getItem("weighted-chinup-v4")||"{}");
Object.entries(saved).forEach(([k,v])=>{const e=document.getElementById(k);if(e)e.value=v});
document.querySelectorAll("input,select").forEach(e=>e.addEventListener("input",recalc));
recalc();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>

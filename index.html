<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strength</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<style>
body{
    font-family: Arial, sans-serif;
    background:#111;
    color:#f5f5f5;
    margin:0;
    padding:16px;
}
.container{
    max-width:700px;
    margin:auto;
}
.section{
    background:#1d1d1d;
    padding:16px;
    margin-bottom:16px;
    border-radius:12px;
}
h1,h2{
    margin-top:0;
}
label{
    display:block;
    margin-top:10px;
}
input,select{
    width:100%;
    padding:10px;
    margin-top:4px;
    border-radius:8px;
    border:none;
    font-size:16px;
}
.output{
    margin-top:10px;
    padding:10px;
    background:#2a2a2a;
    border-radius:8px;
}
.small{
    font-size:14px;
    opacity:0.9;
}
</style>
</head>
<body>
<div class="container">
<h1>Strength</h1>

<div class="section">
<h2>Daily Inputs</h2>

<label>Bodyweight
<input type="number" id="bw" step="0.1">
</label>

<label>Bodyweight + Belt
<input type="number" id="bwbelt" step="0.1">
</label>
</div>

<div class="section">
<h2>Feeler Set</h2>

<label>Reps
<input type="number" id="feelerReps">
</label>

<label>RPE
<select id="feelerRpe"></select>
</label>

<label>Target Reps
<input type="number" id="targetReps">
</label>

<label>Target RPE
<select id="targetRpe"></select>
</label>

<div class="output">
<div id="feelerE1rm"></div>
<div id="topSuggestion"></div>
<div id="topExternal"></div>
<div id="topPlates"></div>
</div>
</div>

<div class="section">
<h2>Top Set Performed</h2>

<label>Actual Added Weight
<input type="number" id="actualLoad" step="0.1">
</label>

<label>Actual Reps
<input type="number" id="actualReps">
</label>

<label>Actual RPE
<select id="actualRpe"></select>
</label>

<div class="output">
<div id="updatedE1rm"></div>
</div>
</div>

<div class="section">
<h2>Backoff Sets</h2>

<label>Backoff %
<input type="number" id="backoffPct" value="72">
</label>

<label>Backoff Reps
<input type="number" id="backoffReps">
</label>

<div class="output">
<div id="backoffTotal"></div>
<div id="backoffExternal"></div>
<div id="backoffPlates"></div>
</div>
</div>

</div>

<script>
const plateOptions = [44,33,22,11,5.5,2.75,2.2,1.1,0.55,0.275];

const rpeTable = {
"1@10":1.00,"1@9.5":0.978,"1@9":0.955,"1@8.5":0.939,"1@8":0.922,"1@7.5":0.907,"1@7":0.892,"1@6.5":0.878,
"2@10":0.955,"2@9.5":0.939,"2@9":0.922,"2@8.5":0.907,"2@8":0.892,"2@7.5":0.878,"2@7":0.863,"2@6.5":0.850,
"3@10":0.922,"3@9.5":0.907,"3@9":0.892,"3@8.5":0.878,"3@8":0.863,"3@7.5":0.850,"3@7":0.837,"3@6.5":0.824,
"4@10":0.892,"4@9.5":0.878,"4@9":0.863,"4@8.5":0.850,"4@8":0.837,"4@7.5":0.824,"4@7":0.811,"4@6.5":0.798,
"5@10":0.863,"5@9.5":0.850,"5@9":0.837,"5@8.5":0.824,"5@8":0.811,"5@7.5":0.798,"5@7":0.786,"5@6.5":0.774,
"6@10":0.837,"6@9.5":0.824,"6@9":0.811,"6@8.5":0.798,"6@8":0.786,"6@7.5":0.774,"6@7":0.762,"6@6.5":0.750,
"7@10":0.811,"7@9.5":0.798,"7@9":0.786,"7@8.5":0.774,"7@8":0.762,"7@7.5":0.750,"7@7":0.739,"7@6.5":0.723,
"8@10":0.786,"8@9.5":0.774,"8@9":0.762,"8@8.5":0.750,"8@8":0.739,"8@7.5":0.723,"8@7":0.707,"8@6.5":0.694,
"9@10":0.762,"9@9.5":0.750,"9@9":0.739,"9@8.5":0.723,"9@8":0.707,"9@7.5":0.694,"9@7":0.680,"9@6.5":0.667,
"10@10":0.739,"10@9.5":0.723,"10@9":0.707,"10@8.5":0.694,"10@8":0.680,"10@7.5":0.667,"10@7":0.653,"10@6.5":0.640,
"11@10":0.707,"11@9.5":0.694,"11@9":0.680,"11@8.5":0.667,"11@8":0.653,"11@7.5":0.640,"11@7":0.626,"11@6.5":0.613,
"12@10":0.680,"12@9.5":0.667,"12@9":0.653,"12@8.5":0.640,"12@8":0.626,"12@7.5":0.613,"12@7":0.600,"12@6.5":0.586
};

const rpes = [10,9.5,9,8.5,8,7.5,7,6.5];

function populateRPE(id){
    const sel = document.getElementById(id);
    rpes.forEach(r=>{
        const opt=document.createElement("option");
        opt.value=r;
        opt.text=r;
        sel.appendChild(opt);
    });
}

populateRPE("feelerRpe");
populateRPE("targetRpe");
populateRPE("actualRpe");

function roundDownPlates(target){
    let remaining = Math.max(0,target);
    const used=[];

    for(let p of plateOptions){
        while(remaining + 1e-9 >= p){
            used.push(p);
            remaining -= p;
        }
    }

    const total = used.reduce((a,b)=>a+b,0);

    return {
        total: total,
        plates: used.length ? used.join(" + ") : "Bodyweight only"
    };
}

function getPct(reps,rpe){
    return rpeTable[`${reps}@${rpe}`];
}

function recalc(){

    const bw = parseFloat(document.getElementById("bw").value)||0;
    const bwbelt = parseFloat(document.getElementById("bwbelt").value)||0;

    const feelerReps = parseInt(document.getElementById("feelerReps").value)||0;
    const feelerRpe = document.getElementById("feelerRpe").value;

    const targetReps = parseInt(document.getElementById("targetReps").value)||0;
    const targetRpe = document.getElementById("targetRpe").value;

    const feelerPct = getPct(feelerReps,feelerRpe);

    if(feelerPct){
        const e1rm = bw / feelerPct;

        document.getElementById("feelerE1rm").innerHTML =
        `<strong>Estimated 1RM:</strong> ${e1rm.toFixed(1)} lbs`;

        const targetPct = getPct(targetReps,targetRpe);

        if(targetPct){
            const targetTotal = e1rm * targetPct;
            const extLoad = Math.max(0,targetTotal - bwbelt);

            const rounded = roundDownPlates(extLoad);

            document.getElementById("topSuggestion").innerHTML =
            `<strong>Suggested Total Weight:</strong> ${targetTotal.toFixed(1)} lbs`;

            document.getElementById("topExternal").innerHTML =
            `<strong>Suggested Added Weight:</strong> ${rounded.total.toFixed(3)} lbs`;

            document.getElementById("topPlates").innerHTML =
            `<strong>Plates:</strong> ${rounded.plates}`;
        }
    }

    const actualLoad = parseFloat(document.getElementById("actualLoad").value)||0;
    const actualReps = parseInt(document.getElementById("actualReps").value)||0;
    const actualRpe = document.getElementById("actualRpe").value;

    const actualPct = getPct(actualReps,actualRpe);

    if(actualPct){
        const actualTotal = bwbelt + actualLoad;
        const updated = actualTotal / actualPct;

        document.getElementById("updatedE1rm").innerHTML =
        `<strong>Updated Session e1RM:</strong> ${updated.toFixed(1)} lbs`;

        const backoffPct = (parseFloat(document.getElementById("backoffPct").value)||0)/100;

        const backoffTotal = updated * backoffPct;
        const backoffExt = Math.max(0,backoffTotal - bwbelt);

        const roundedBackoff = roundDownPlates(backoffExt);

        document.getElementById("backoffTotal").innerHTML =
        `<strong>Backoff Total Weight:</strong> ${backoffTotal.toFixed(1)} lbs`;

        document.getElementById("backoffExternal").innerHTML =
        `<strong>Backoff Added Weight:</strong> ${roundedBackoff.total.toFixed(3)} lbs`;

        document.getElementById("backoffPlates").innerHTML =
        `<strong>Backoff Plates:</strong> ${roundedBackoff.plates}`;
    }

    localStorage.setItem("strengthData", JSON.stringify({
        bw,bwbelt,feelerReps,feelerRpe,targetReps,targetRpe,
        actualLoad,actualReps,actualRpe,
        backoffPct:document.getElementById("backoffPct").value
    }));
}

document.querySelectorAll("input,select").forEach(el=>{
    el.addEventListener("input",recalc);
});

const saved = JSON.parse(localStorage.getItem("strengthData")||"{}");

Object.keys(saved).forEach(k=>{
    const el=document.getElementById(k);
    if(el){ el.value=saved[k]; }
});

recalc();

if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>

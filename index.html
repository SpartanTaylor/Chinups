<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<title>Weighted Chinup Calculator</title>
<style>
:root{
  --bg:#111111;
  --card:#1c1c1e;
  --field:#2c2c2e;
  --line:#3a3a3c;
  --text:#f4f4f4;
  --muted:#a9a9ae;
  --gold:#f2c94c;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
main{max-width:720px;margin:auto;padding:20px 14px 44px}
h1{font-size:30px;line-height:1.1;margin:4px 0 18px;font-weight:800;letter-spacing:-.4px}
.card{background:var(--card);border-radius:18px;padding:18px;margin:14px 0}
h2{font-size:20px;line-height:1.2;margin:0 0 14px;font-weight:750;letter-spacing:-.15px}
label{
  display:block;
  font-size:14px;
  font-weight:600;
  margin:15px 0 6px;
  color:#d7d7da;
}
input,select{
  width:100%;
  min-height:50px;
  font-size:18px;
  padding:13px 14px;
  border:1px solid transparent;
  border-radius:12px;
  background:var(--field);
  color:#fff;
  outline:none;
}
input:focus,select:focus{border-color:var(--gold)}
.result{
  margin-top:15px;
  padding:14px;
  background:var(--field);
  border-radius:12px;
  line-height:1.4;
}
.output-group{display:grid;gap:4px}
.output-row{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:14px;
  min-height:25px;
}
.output-label{color:var(--muted);font-size:14px;font-weight:600}
.output-value{color:var(--text);font-size:16px;font-weight:750;text-align:right;white-space:nowrap}
.output-row.gold .output-value{color:var(--gold)}
.output-row.key .output-label{color:#e4e4e7;font-size:15px}
.output-row.key .output-value{font-size:20px;font-weight:850}
.output-divider{height:1px;background:var(--line);margin:10px 0 8px}
.plates-heading{font-weight:800;font-size:16px;margin:14px 0 5px}
.plate-lines{display:grid;gap:3px}
.plate-unit{color:var(--muted);font-weight:750;margin-right:5px}
.plate-text{color:var(--gold);font-weight:700}
.muted{color:var(--muted);font-size:13px}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}

/* Compact visual belt/plate display inspired by the supplied reference. */
.plate-visual{
  position:relative;
  margin-top:12px;
  min-height:230px;
  overflow-x:auto;
  overflow-y:hidden;
  padding:14px 8px 10px;
  border-radius:10px;
  background:#f7f7f7;
  color:#111;
}
.plate-summary{
  display:flex;
  justify-content:space-between;
  padding:0 6px 8px;
  font-size:15px;
  font-weight:750;
}
.belt-stage{
  position:relative;
  display:flex;
  align-items:center;
  min-width:max-content;
  height:170px;
  padding:0 14px 0 8px;
}
.belt-loop{
  width:46px;height:88px;border:7px solid #8e8e93;border-left:0;border-radius:0 24px 24px 0;flex:none
}
.belt-strap{width:44px;height:58px;background:#242424;flex:none}
.plate-stack{display:flex;align-items:center;gap:3px;flex:none}
.plate-block{
  min-width:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:15px;
  font-weight:800;
  border-radius:1px;
  padding:0 4px;
}
.chain{
  position:relative;
  width:190px;
  height:10px;
  background:#858585;
  margin-left:10px;
  flex:none;
  border-radius:5px;
}
.chain::before,
.chain::after{
  content:"";
  position:absolute;
  top:-13px;
  width:28px;
  height:34px;
  border:6px solid #858585;
  border-radius:14px;
}
.chain::before{left:18px}
.chain::after{left:78px}


.ios-titlebar{
  position:sticky;
  top:0;
  z-index:20;
  margin:-20px -14px 14px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
  background:rgba(17,17,17,.92);
  -webkit-backdrop-filter:blur(18px);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.08);
}
.ios-title{
  text-align:center;
  font-size:17px;
  font-weight:750;
  letter-spacing:-.15px;
}
.copy-wrap{
  display:inline-flex;
  align-items:center;
  justify-content:flex-end;
  gap:8px;
}
.copy-btn{
  flex:none;
  width:30px;
  height:30px;
  min-height:0;
  padding:0;
  margin:0;
  border:0;
  border-radius:8px;
  background:#3a3a3c;
  color:#fff;
  font-size:15px;
  line-height:1;
  cursor:pointer;
}
.copy-btn:active{transform:scale(.96)}
.copy-btn.copied{background:#5b4a16;color:var(--gold)}
.result.has-output{animation:sectionFade .22s ease-out}
@keyframes sectionFade{
  from{opacity:0;transform:translateY(4px)}
  to{opacity:1;transform:translateY(0)}
}

/* More realistic dip-belt illustration */
.plate-visual{
  min-height:260px;
  padding:14px 8px 12px;
}
.belt-stage{
  height:195px;
  padding:0 20px 0 12px;
  align-items:center;
}
.belt-strap{
  position:relative;
  width:72px;
  height:92px;
  background:linear-gradient(90deg,#181818,#2a2a2a 55%,#151515);
  border-radius:8px 2px 2px 8px;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.06);
}
.belt-strap::before,
.belt-strap::after{
  content:"";
  position:absolute;
  right:-18px;
  width:26px;
  height:12px;
  background:#222;
  border-radius:4px;
}
.belt-strap::before{top:18px}
.belt-strap::after{bottom:18px}
.belt-loop{
  width:48px;
  height:86px;
  border:9px solid #8c8c91;
  border-left:0;
  border-radius:0 28px 28px 0;
  box-shadow:inset -2px 0 0 rgba(255,255,255,.25);
}
.plate-stack{
  position:relative;
  display:flex;
  align-items:center;
  gap:0;
  margin-left:2px;
}
.plate-block{
  position:relative;
  margin-left:-8px;
  border-radius:50% / 8%;
  box-shadow:
    inset 5px 0 0 rgba(255,255,255,.16),
    inset -7px 0 0 rgba(0,0,0,.2),
    2px 2px 4px rgba(0,0,0,.3);
  border:1px solid rgba(0,0,0,.3);
}
.plate-block:first-child{margin-left:0}
.plate-block::before{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:12px;
  height:28px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#d4d4d4;
  box-shadow:inset 0 0 0 3px #777;
  z-index:1;
}
.plate-block span{
  position:relative;
  z-index:2;
  text-shadow:0 1px 2px rgba(0,0,0,.55);
}
.chain{
  position:relative;
  width:200px;
  height:20px;
  margin-left:4px;
  background:none;
}
.chain::before{
  content:"";
  position:absolute;
  left:0;
  top:4px;
  width:195px;
  height:12px;
  background:
    radial-gradient(ellipse at center,transparent 44%,#858585 46% 62%,transparent 64%) 0 0/28px 12px repeat-x;
}
.chain::after{
  content:"";
  position:absolute;
  left:14px;
  top:4px;
  width:195px;
  height:12px;
  background:
    radial-gradient(ellipse at center,transparent 44%,#858585 46% 62%,transparent 64%) 0 0/28px 12px repeat-x;
  transform:rotate(90deg) scaleY(.45);
  transform-origin:left center;
  opacity:.85;
}

</style>
</head>
<body>
<main>
<header class="ios-titlebar"><div class="ios-title">Weighted Chinup Calculator</div></header>

<div class="card">
<label>Bodyweight (lbs)<input id="bw" type="number" step="0.1" inputmode="decimal"></label>
<label>Bodyweight + Belt (lbs)<input id="bwbelt" type="number" step="0.1" inputmode="decimal"></label>
</div>

<div class="card">
<h2>Feeler Set → Top Set Recommendation</h2>
<label>Feeler Set Reps (@ bodyweight only)<input id="feelerReps" type="number" min="1" max="12" step="1" inputmode="numeric"></label>
<label>Feeler Set RIR / RPE<select id="feelerRpe"></select></label>
<label>Target Top Set Reps<input id="targetReps" type="number" min="1" max="12" step="1" inputmode="numeric"></label>
<label>Target Top Set RIR / RPE<select id="targetRpe"></select></label>
<div class="result" id="topOutput">Enter your feeler set and target.</div>
</div>

<div class="card">
<h2>Actual Top Set → Backoff Recommendation</h2>
<label>Actual Added Weight (lbs)<input id="actualLoad" type="number" min="0" step="0.001" inputmode="decimal"></label>
<label>Actual Top Set Reps<input id="actualReps" type="number" min="1" max="12" step="1" inputmode="numeric"></label>
<label>Actual Top Set RIR / RPE<select id="actualRpe"></select></label>
<div class="result" id="e1rmOutput">Enter your actual top set.</div>
<hr>
<label>Backoff Reps<input id="backoffReps" type="number" min="1" max="12" step="1" inputmode="numeric"></label>
<label>Backoff RIR / RPE Cap<select id="backoffRpe"></select></label>
<div class="result" id="backoffOutput">Enter your actual top set, backoff reps and RPE cap.</div>
</div>
</main>

<script>
const rpeLabels=[
["0 RIR / RPE 10",10],["0.5 RIR / RPE 9.5",9.5],["1 RIR / RPE 9",9],
["1.5 RIR / RPE 8.5",8.5],["2 RIR / RPE 8",8],["2.5 RIR / RPE 7.5",7.5],
["3 RIR / RPE 7",7],["3.5 RIR / RPE 6.5",6.5],["4 RIR / RPE 6",6],
["4.5 RIR / RPE 5.5",5.5],["5 RIR / RPE 5",5],["5.5 RIR / RPE 4.5",4.5],
["6 RIR / RPE 4",4],["6.5 RIR / RPE 3.5",3.5],["7 RIR / RPE 3",3],
["7.5 RIR / RPE 2.5",2.5],["8 RIR / RPE 2",2],["8.5 RIR / RPE 1.5",1.5],
["9 RIR / RPE 1",1]
];

// User-provided chart. Values are percentages, not decimals.
const chart={
1:[100,97.8,95.5,93,91,89,87,85,83,81,79,77,75,73,71,69,67,65,63],
2:[95.5,93.5,91,89,87,85,83,81,79,77,75,73,71,69,67,65,63,61,59],
3:[92.2,90,87.5,85.5,83.5,81.5,79.5,77.5,75.5,73.5,71.5,69.5,67.5,65.5,63.5,61.5,59.5,57.5,55.5],
4:[89.2,87,84.5,82.5,80.5,78.5,76.5,74.5,72.5,70.5,68.5,66.5,64.5,62.5,60.5,58.5,56.5,54.5,52.5],
5:[86.3,84,81.5,79.5,77.5,75.5,73.5,71.5,69.5,67.5,65.5,63.5,61.5,59.5,57.5,55.5,53.5,51.5,49.5],
6:[83.7,81.5,79,77,75,73,71,69,67,65,63,61,59,57,55,53,51,49,47],
7:[81.1,79.5,76.5,75,73,71,69,67,65,63,61,59,57,55,53,51,49,47,45],
8:[78.6,76.5,74,72,70,68,66,64,62,60,58,56,54,52,50,48,46,44,42],
9:[76.2,74,71.5,69.5,67.5,65.5,63.5,61.5,59.5,57.5,55.5,53.5,51.5,49.5,47.5,45.5,43.5,41.5,39.5],
10:[73.9,71.5,69,67,65,63,61,59,57,55,53,51,49,47,45,43,41,39,37],
11:[71.8,69.5,67,65,63,61,59,57,55,53,51,49,47,45,43,41,39,37,35],
12:[69.8,67.5,65,63,61,59,57,55,53,51,49,47,45,43,41,39,37,35,33]
};

const rpes=[10,9.5,9,8.5,8,7.5,7,6.5,6,5.5,5,4.5,4,3.5,3,2.5,2,1.5,1];

function fillSelect(id){
 const s=document.getElementById(id);
 rpeLabels.forEach(([label,val])=>{
  const o=document.createElement("option");o.value=val;o.textContent=label;s.appendChild(o);
 });
}
["feelerRpe","targetRpe","actualRpe","backoffRpe"].forEach(fillSelect);

// Inventory: unlimited larger plates, max 2 microplates each.
const unlimited=[44,33,22,11,5.5,2.75];
const micro=[2.2,1.1,0.55,0.275];

function plateCombo(target){
 target=Math.max(0,target);
 const T=Math.floor(target*1000+1e-7);
 let best=-1,bestCount=Infinity,bestVec=null;

 for(let a=0;a<=2;a++)for(let b=0;b<=2;b++)for(let c=0;c<=2;c++)for(let d=0;d<=2;d++){
   const micros=[a,b,c,d];
   const microSum=Math.round((a*2.2+b*1.1+c*.55+d*.275)*1000);
   if(microSum>T) continue;
   let rem=T-microSum;
   const counts=[];
   let n=0;
   for(const p of unlimited){
     const q=Math.floor(rem/Math.round(p*1000));
     counts.push(q); n+=q; rem-=q*Math.round(p*1000);
   }
   const total=T-rem;
   const vec=[...counts,...micros];
   const count=n+a+b+c+d;
   if(total>best || (total===best && count<bestCount)){
     best=total;bestCount=count;bestVec=vec;
   }
 }
 if(best<=0)return {total:0,lbs:"Bodyweight only",kg:"Bodyweight only",counts:[]};

 const lbs=[44,33,22,11,5.5,2.75,2.2,1.1,0.55,0.275];
 const kg=[20,15,10,5,2.5,1.25,1,0.5,0.25,0.125];
 const lbParts=[];
 const kgParts=[];
 const counts=[];

 bestVec.forEach((n,i)=>{
   if(n>0){
     lbParts.push(n===1?`${lbs[i]}`:`${n} × ${lbs[i]}`);
     kgParts.push(n===1?`${kg[i]}`:`${n} × ${kg[i]}`);
     counts.push({count:n,lbs:lbs[i],kg:kg[i]});
   }
 });

 return {
   total:best/1000,
   lbs:lbParts.join(" + "),
   kg:kgParts.join(" + "),
   counts
 };
}
function pct(reps,rpe){
 if(!chart[reps])return null;
 const i=rpes.indexOf(Number(rpe));
 return i<0?null:chart[reps][i]/100;
}

function val(id){return parseFloat(document.getElementById(id).value)}


const plateStyles={
  "44":{height:152,width:76,color:"#111111"},
  "33":{height:142,width:69,color:"#294d96"},
  "22":{height:132,width:64,color:"#c626c7"},
  "11":{height:120,width:58,color:"#dc2027"},
  "5.5":{height:104,width:52,color:"#f45110"},
  "2.75":{height:92,width:47,color:"#ffe123"},
  "2.2":{height:84,width:43,color:"#294d96"},
  "1.1":{height:76,width:39,color:"#1db34a"},
  "0.55":{height:68,width:36,color:"#961bf2"},
  "0.275":{height:60,width:33,color:"#b9c2d4"}
};

function plateVisual(load){
 if(!load.counts || load.counts.length===0)return "";
 const blocks=[];
 load.counts.forEach(item=>{
   const style=plateStyles[String(item.lbs)]||{height:68,width:36,color:"#555"};
   for(let i=0;i<item.count;i++){
     blocks.push(`<div class="plate-block" style="height:${style.height}px;width:${style.width}px;background:${style.color}"><span>${item.lbs}</span></div>`);
   }
 });
 const kgTotal=(load.total/2.2).toFixed(2);
 return `<div class="plate-visual">
   <div class="plate-summary"><span>${kgTotal} kg</span><span>${load.total.toFixed(2)} lbs</span></div>
   <div class="belt-stage">
     <div class="belt-strap"></div><div class="belt-loop"></div>
     <div class="plate-stack">${blocks.join("")}</div>
     <div class="chain"></div>
   </div>
 </div>`;
}

function outputRow(label,value,key=false,gold=false,copy=false){
 const valueHtml=copy
  ? `<span class="copy-wrap"><span class="output-value">${value}</span><button class="copy-btn" type="button" aria-label="Copy ${label}" onclick="copyOutput(this,'${value.replace(/'/g,"&#39;")}')">⧉</button></span>`
  : `<span class="output-value">${value}</span>`;
 return `<div class="output-row${key?" key":""}${gold?" gold":""}"><span class="output-label">${label}</span>${valueHtml}</div>`;
}

async function copyOutput(button,text){
 try{
   await navigator.clipboard.writeText(text);
 }catch{
   const area=document.createElement("textarea");
   area.value=text;
   area.style.position="fixed";
   area.style.opacity="0";
   document.body.appendChild(area);
   area.select();
   document.execCommand("copy");
   area.remove();
 }
 const old=button.textContent;
 button.textContent="✓";
 button.classList.add("copied");
 setTimeout(()=>{button.textContent=old;button.classList.remove("copied")},900);
}

function recommendationOutput(targetLabel,targetTotal,exactAdded,load,bwbelt){
 return `<div class="output-group">
   ${outputRow(targetLabel,`${targetTotal.toFixed(2)} lbs`,false,false)}
   ${outputRow("Exact added weight required",`${Math.max(0,exactAdded).toFixed(2)} lbs`)}
   <div class="output-divider"></div>
   ${outputRow("Suggested weight",`${load.total.toFixed(2)} lbs`,true,true,true)}
   ${outputRow("Actual total weight",`${(bwbelt+load.total).toFixed(2)} lbs`,true,true,true)}
   <div class="plates-heading">Plates</div>
   <div class="plate-lines">
     <div><span class="plate-unit">LBS:</span><span class="plate-text">${load.lbs}</span></div>
     <div><span class="plate-unit">KG:</span><span class="plate-text">${load.kg}</span></div>
   </div>
   ${plateVisual(load)}
 </div>`;
}


function setResult(id,htmlContent){
 const el=document.getElementById(id);
 const hadOutput=el.dataset.ready==="1";
 el.innerHTML=htmlContent;
 const nowReady=htmlContent && !htmlContent.startsWith("Enter ");
 if(nowReady && !hadOutput){
   el.classList.remove("has-output");
   void el.offsetWidth;
   el.classList.add("has-output");
 }
 el.dataset.ready=nowReady?"1":"0";
}
function recalc(){
 const bw=val("bw"),bwbelt=val("bwbelt");
 const fr=parseInt(document.getElementById("feelerReps").value);
 const fp=pct(fr,val("feelerRpe"));
 const tr=parseInt(document.getElementById("targetReps").value);
 const tp=pct(tr,val("targetRpe"));

 let topText="Enter your feeler set and target.";
 if(fp && bw>0){
   const feelerE1rm=bw/fp;
   if(tp && bwbelt>0){
     topText="";
     const idealTotal=feelerE1rm*tp;
     const exactAdded=idealTotal-bwbelt;
     const load=plateCombo(exactAdded);
     topText=recommendationOutput("Suggested total weight",idealTotal,exactAdded,load,bwbelt);
   }
 }
 setResult("topOutput",topText);

 const al=val("actualLoad"),ar=parseInt(document.getElementById("actualReps").value),ap=pct(ar,val("actualRpe"));
 let eText="Enter your actual top set.";
 if(ap && bwbelt>0 && !isNaN(al)){
   const actualTotal=bwbelt+al;
   const e1rm=actualTotal/ap;
   eText=`<div class="output-group">${outputRow("Daily e1RM",`${e1rm.toFixed(2)} lbs`,true,true,true)}</div>`;
   setResult("e1rmOutput",eText);

   const br=parseInt(document.getElementById("backoffReps").value);
   const backoffPct=pct(br,val("backoffRpe"));
   if(backoffPct){
     const idealBack=e1rm*backoffPct;
     const exactBack=idealBack-bwbelt;
     const backLoad=plateCombo(exactBack);
     let bText=recommendationOutput("Backoff target total weight",idealBack,exactBack,backLoad,bwbelt);
     setResult("backoffOutput",bText);
   }else{
     setResult("backoffOutput","Enter your actual top set, backoff reps and RPE cap.");
   }
 }else{
   setResult("e1rmOutput",eText);
   setResult("backoffOutput","Enter your actual top set, backoff reps and RPE cap.");
 }

 const data={};
 document.querySelectorAll("input,select").forEach(x=>data[x.id]=x.value);
 localStorage.setItem("weighted-chinup-v10",JSON.stringify(data));
}

const saved=JSON.parse(localStorage.getItem("weighted-chinup-v10")||"{}");
Object.entries(saved).forEach(([k,v])=>{const e=document.getElementById(k);if(e)e.value=v});
document.querySelectorAll("input,select").forEach(e=>{e.addEventListener("input",recalc);e.addEventListener("change",recalc);});
recalc();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
